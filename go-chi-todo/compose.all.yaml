include:
  - compose.db.yaml

services:
  todo-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-joergjo/go-chi-todo}
    ports:
      - "8080:8080"
    environment:
      - PGHOST=todo-db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=pass@word1
      - PGDATABASE=todo
      - TODO_DEBUG=${TODO_DEBUG:-true}
    depends_on:
      - todo-db
